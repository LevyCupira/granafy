name: Deploy Granafy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Deploy
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git fetch origin gh-pages:gh-pages || echo "Creating gh-pages branch"
          git checkout gh-pages || git checkout --orphan gh-pages
          git rm -rf . || true
          git checkout main -- .
          git add .
          git commit -m "Deploy from main" || echo "No changes to commit"
          git push origin gh-pages --force
