name: Deploy Granafy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Inject Supabase Key
        run: |
          sed -i "s|window.SUPABASE_KEY = window.SUPABASE_KEY || 'sb_publishable_[^']*';|window.SUPABASE_KEY = window.SUPABASE_KEY || '${{ secrets.SUPABASE_KEY }}';|g" index.html

      - name: Verify injection
        run: grep "window.SUPABASE_KEY" index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          cname: granafy.levycupira.dev
