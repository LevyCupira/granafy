# Backup semanal do banco Supabase do Granafy.
# Gera um arquivo criptografado com senha e guarda como "artifact" do GitHub por 90 dias.
# O repositório é público: por isso o backup NUNCA é commitado e sempre sai criptografado.
#
# Secrets necessários (Settings > Secrets and variables > Actions):
#   SUPABASE_DB_URL -> string de conexão do "Session pooler"
#                      (Supabase > Connect > Session pooler), já com a senha do banco no lugar de [YOUR-PASSWORD]
#   BACKUP_SENHA    -> uma senha forte só para os backups (guarde num lugar seguro: sem ela não dá para abrir)

name: Supabase - backup

on:
  schedule:
    - cron: '43 9 * * 1'   # toda segunda, 06:43 no horário de Brasília
  workflow_dispatch:       # permite rodar manualmente pela aba Actions

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar secrets
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_SENHA: ${{ secrets.BACKUP_SENHA }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_SENHA" ]; then
            echo "::error::Configure os secrets SUPABASE_DB_URL e BACKUP_SENHA."
            exit 1
          fi

      - name: Instalar cliente PostgreSQL 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Gerar dump
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          PG_DUMP=/usr/lib/postgresql/17/bin/pg_dump
          mkdir backup

          # Tabelas do app (estrutura + dados)
          $PG_DUMP "$SUPABASE_DB_URL" --schema=public --no-owner --no-privileges \
            -f backup/granafy_public.sql

          # Usuários de login (as tabelas do app apontam para auth.users)
          $PG_DUMP "$SUPABASE_DB_URL" --data-only \
            --table=auth.users --table=auth.identities \
            -f backup/granafy_auth_usuarios.sql \
            || echo "::warning::Não foi possível copiar os usuários de login (auth). O backup das tabelas do app foi feito."

          ls -lh backup/

      - name: Criptografar
        env:
          BACKUP_SENHA: ${{ secrets.BACKUP_SENHA }}
        run: |
          DATA=$(date -u +%Y-%m-%d)
          echo "DATA=$DATA" >> "$GITHUB_ENV"
          tar -czf "granafy_backup_$DATA.tar.gz" backup/
          echo "$BACKUP_SENHA" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 \
            -o "granafy_backup_$DATA.tar.gz.gpg" "granafy_backup_$DATA.tar.gz"
          rm -rf backup/ "granafy_backup_$DATA.tar.gz"
          ls -lh granafy_backup_*.gpg

      - name: Guardar backup (90 dias)
        uses: actions/upload-artifact@v4
        with:
          name: granafy-backup-${{ env.DATA }}
          path: granafy_backup_*.gpg
          retention-days: 90
          if-no-files-found: error
