# Mantém o projeto Supabase (plano gratuito) ativo.
# O Supabase pausa projetos gratuitos após ~7 dias com pouca atividade.
# Este workflow faz uma consulta leve ao banco a cada 2 dias.
#
# Secrets necessários (Settings > Secrets and variables > Actions):
#   SUPABASE_URL  -> https://pjnnkaafrxruooplccnz.supabase.co
#   SUPABASE_KEY  -> a chave publishable (sb_publishable_...)

name: Supabase - manter ativo

on:
  schedule:
    - cron: '17 11 */2 * *'   # a cada 2 dias, 08:17 no horário de Brasília
  workflow_dispatch:          # permite rodar manualmente pela aba Actions

permissions:
  actions: write   # usado só para manter os workflows agendados habilitados
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta leve ao banco
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Configure os secrets SUPABASE_URL e SUPABASE_KEY."
            exit 1
          fi
          status=$(curl -s -o resposta.json -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/clientes?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY")
          echo "HTTP $status"
          if [ "$status" -ge 400 ]; then
            echo "::error::O Supabase respondeu com erro $status. O projeto pode estar pausado."
            cat resposta.json
            exit 1
          fi
          echo "Supabase ativo."

      # O GitHub desliga workflows agendados em repositórios sem commits há 60 dias.
      # Reabilitar via API reinicia essa contagem, sem criar commits no repo.
      - name: Manter workflows agendados habilitados
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in supabase-manter-ativo.yml supabase-backup.yml deploy.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable" \
              && echo "$wf habilitado" || echo "Aviso: não consegui reabilitar $wf"
          done
